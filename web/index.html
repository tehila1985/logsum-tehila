<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogSum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: chat column + side rail (memory, logs, session). Full-height app, composer pinned at the bottom. */
:root {
  --bg: #f3f4f2; --surface: #ffffff; --sunk: #e9ebe7; --fg: #1b2220; --muted: #5d6763; --line: #d5d9d4;
  --accent: #2f4a9e; --accent-fg: #ffffff; --accent-soft: #e3e8f7;
  --ok: #1f7a4d; --ok-soft: #dcf0e4; --warn: #9a5b00; --warn-soft: #f8ead2; --err: #b42318; --err-soft: #fbe3e0;
  --font-ui: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121615; --surface: #1a201e; --sunk: #222927; --fg: #e4e8e6; --muted: #98a39e; --line: #2f3835;
    --accent: #8ea6f0; --accent-fg: #0f1530; --accent-soft: #232c49;
    --ok: #5cc98f; --ok-soft: #173326; --warn: #e3a64a; --warn-soft: #3a2a12; --err: #f08378; --err-soft: #3d1c19;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px max(16px, 2vw); border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; }
.brand span { color: var(--muted); font-size: 13px; }
.switch { display: inline-flex; gap: 3px; background: var(--sunk); padding: 3px; border-radius: 8px; }
.switch button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.switch button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.switch button:disabled { opacity: .5; cursor: not-allowed; }
.badge { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } .rail.open { display: flex; } }

.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
.messages { overflow-y: auto; padding: 20px max(16px, 3vw); display: flex; flex-direction: column; gap: 14px; }
.inner-w { width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.welcome { display: flex; flex-direction: column; gap: 14px; padding: 24px 0; }
.welcome h2 { margin: 0; font-size: 22px; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 12px; border-radius: 999px; font-size: 13px; text-align: start; }
.suggest button:hover { border-color: var(--accent); color: var(--accent); }

.msg-user { align-self: flex-start; max-width: 85%; background: var(--accent); color: var(--accent-fg); padding: 9px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-bot { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.msg-bot.error { border-color: var(--err); background: var(--err-soft); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--sunk); white-space: nowrap; direction: ltr; }
.chip.mem { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.answer { min-width: 0; overflow-wrap: anywhere; }
.answer p { margin: 0 0 8px; } .answer > *:last-child { margin-bottom: 0; }
.answer ul, .answer ol { margin: 0 0 8px; padding-inline-start: 22px; }
.answer code { font-family: var(--font-mono); font-size: 13px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.answer pre { background: var(--sunk); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; }
.answer .tablewrap { overflow-x: auto; margin: 4px 0 8px; }
.answer table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.answer th, .answer td { border: 1px solid var(--line); padding: 4px 10px; text-align: start; }
.answer th { background: var(--sunk); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); direction: ltr; justify-content: flex-end; }
.meta b { color: var(--fg); font-weight: 500; }
.working { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 600; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 12px max(16px, 3vw) 14px; }
.composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  font: inherit; background: var(--bg); color: var(--fg); max-height: 160px; }
.composer .send { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 10px 18px; font-weight: 600; }
.composer .send:disabled { opacity: .5; cursor: not-allowed; }
.hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

.rail { border-inline-start: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.rail section { display: flex; flex-direction: column; gap: 8px; }
.rail h2 { margin: 0; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rail h2 small { color: var(--muted); font-weight: 500; font-size: 12px; }
.mem-section h3 { margin: 4px 0 2px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-family: var(--font-mono); }
.mem-item { font-size: 13px; padding: 6px 8px; border-radius: 6px; background: var(--sunk); overflow-wrap: anywhere; direction: ltr; text-align: left; margin-bottom: 4px; }
.mem-item .k { font-family: var(--font-mono); font-weight: 500; }
.mem-item.added { background: var(--ok-soft); box-shadow: inset 3px 0 0 var(--ok); }
.mem-item.changed { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--warn); }
.mem-item.removed { background: var(--err-soft); box-shadow: inset 3px 0 0 var(--err); text-decoration: line-through; color: var(--muted); }
.empty { font-size: 13px; color: var(--muted); font-style: italic; }
.logs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.logs li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 5px 8px; background: var(--sunk); border-radius: 6px; }
.logs .mono { direction: ltr; }
.logs small { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.totals { font-family: var(--font-mono); font-size: 12px; color: var(--muted); direction: ltr; text-align: left; }
.notice { font-size: 13px; background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; }
.rail-toggle { display: none; }
@media (max-width: 900px) { .rail-toggle { display: inline-block; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>LogSum</h1><span>סוכן לסיכום לוגים</span></div>
    <div class="switch" role="group" aria-label="harness">
      <button id="h-sdk" data-h="sdk" aria-pressed="true">SDK</button>
      <button id="h-api" data-h="api" aria-pressed="false">API</button>
    </div>
    <span class="badge" id="model"></span>
    <button class="btn rail-toggle" id="railBtn" aria-controls="rail">זיכרון ולוגים</button>
  </header>

  <div class="body">
    <div class="chat">
      <div class="messages" id="scroller"><div class="inner-w" id="messages"></div></div>
      <div class="composer">
        <form id="form">
          <textarea id="input" rows="1" placeholder="שאלי על הלוגים, למשל: מה השגיאות העיקריות ב-app.log?" aria-label="הודעה"></textarea>
          <button class="send" id="send" type="submit">שליחה</button>
        </form>
        <p class="hint">Enter לשליחה, ‏Shift+Enter לשורה חדשה. כל תשובה עוברת דרך הסוכן האמיתי, ולוקחת כמה שניות.</p>
      </div>
    </div>

    <aside class="rail" id="rail">
      <section>
        <h2>שיחה <small id="session"></small></h2>
        <div class="btns">
          <button class="btn" id="newSession" title="מופע חדש של הסוכן. השיחה מתחילה מאפס, הזיכרון נשאר">שיחה חדשה</button>
          <button class="btn danger" id="reset" title="מוחק זיכרון, היסטוריה ומחזיר את הלוגים המקוריים">איפוס מלא</button>
        </div>
        <div class="totals" id="totals"></div>
      </section>
      <section>
        <h2>זיכרון <small>memory.json</small></h2>
        <div id="memory"></div>
      </section>
      <section>
        <h2>קובצי לוג</h2>
        <ul class="logs" id="logs"></ul>
        <div class="btns">
          <button class="btn" id="simulate" title="מוסיף ל-worker.log שגיאות של יום חדש: S3 AccessDenied חדשה ו-DBTimeout שחוזרת">הוספת שגיאות חדשות</button>
          <label class="btn" for="upload">העלאת קובץ .log</label>
          <input type="file" id="upload" accept=".log,text/plain" hidden>
        </div>
        <p class="note">פורמט שורה: <span class="mono" dir="ltr">2026-10-22T14:00:00 ERROR service message</span></p>
      </section>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString("en-US");
  const SECTIONS = { preferences: "העדפות", ignore: "להתעלם", known_issues: "בעיות ידועות", incidents: "אירועים" };
  const SUGGEST = [
    "Which log files do I have, and what are the main errors in app.log?",
    "Check nginx.log for 5xx errors. Which endpoint and when? Save this as an incident.",
    "The DBTimeout errors in worker.log are known - caused by the nightly backup. Remember that, and always ignore healthcheck lines.",
    "What's new in worker.log? Only things I don't already know about.",
    "מה היה האירוע על checkout?",
    "מעכשיו תעני לי בעברית ובבולטים קצרים.",
  ];

  if (window.marked) window.marked.use({ renderer: { html(t) { return esc(typeof t === "string" ? t : t.text); } } });
  const md = (s) => {
    if (!window.marked) return `<p>${esc(s).replace(/\n/g, "<br>")}</p>`;
    return window.marked.parse(s || "", { gfm: true })
      .replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>");
  };

  let harness = "sdk", state = null, busy = false, lastMemory = null;
  const chats = { sdk: [], api: [] };          // rendered items per harness
  const spent = { sdk: 0, api: 0 }, calls = { sdk: 0, api: 0 };

  async function api(path, body) {
    const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ harness, ...body }) } : undefined);
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ---------- rendering ----------
  function renderMessages() {
    const items = chats[harness];
    const box = $("messages");
    if (!items.length) {
      const h = state && state.current;
      box.innerHTML = `<div class="welcome">
        <h2>מה קרה בלוגים?</h2>
        <p>הסוכן קורא את קובצי הלוג דרך כלים, מקבץ שגיאות וזוכר מה כבר ידוע לך. כרגע פעיל ה-harness של <b>${harness.toUpperCase()}</b>.</p>
        ${h && !h.available ? `<div class="notice" dir="ltr">${esc(h.reason)}</div>` : ""}
        <div class="suggest">${SUGGEST.map((s, i) => `<button data-s="${i}" dir="auto">${esc(s)}</button>`).join("")}</div></div>`;
      return;
    }
    box.innerHTML = items.map(renderItem).join("");
    const sc = $("scroller"); sc.scrollTop = sc.scrollHeight;
  }

  function chip(c) {
    const a = c.input && (c.input.file || c.input.key || c.input.pattern || c.input.query || c.input.kind);
    const mem = ["remember", "forget", "recall"].includes(c.name);
    return `<span class="chip ${mem ? "mem" : ""}">${esc(c.name)}(${a ? esc(a) : ""})</span>`;
  }

  function renderItem(it) {
    if (it.kind === "user") return `<div class="msg-user" dir="auto">${esc(it.text)}</div>`;
    if (it.kind === "divider") return `<div class="divider">${esc(it.text)}</div>`;
    if (it.kind === "working") return `<div class="msg-bot"><div class="working"><span class="dots"><i></i><i></i><i></i></span>
      <span>הסוכן עובד: קורא לוגים ומפעיל כלים <span class="mono" id="elapsed">0s</span></span></div></div>`;
    if (it.kind === "error") return `<div class="msg-bot error"><div class="answer" dir="auto">${esc(it.text)}</div></div>`;
    const t = it.turn;
    return `<div class="msg-bot">
      ${t.tool_calls.length ? `<div class="tools">${t.tool_calls.map(chip).join("")}</div>` : ""}
      <div class="answer" dir="auto">${md(t.response)}</div>
      <div class="meta"><span>in <b>${fmt(t.input)}</b></span><span>cache read <b>${fmt(t.cache_read)}</b></span>
        <span>cache write <b>${fmt(t.cache_write)}</b></span><span>out <b>${fmt(t.output)}</b></span>
        <span>calls <b>${t.model_calls}</b></span><span><b>$${Number(t.cost_usd).toFixed(4)}</b></span><span><b>${t.seconds}s</b></span></div></div>`;
  }

  function renderMemory(mem) {
    const before = lastMemory || mem;
    let html = "";
    for (const sec of Object.keys(SECTIONS)) {
      const a = before[sec] || {}, b = mem[sec] || {};
      const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])];
      const rows = keys.map((k) => {
        const cls = !(k in b) ? "removed" : !(k in a) ? "added" : a[k] !== b[k] ? "changed" : "";
        return `<div class="mem-item ${cls}"><span class="k">${esc(k)}</span>: ${esc(k in b ? b[k] : a[k])}</div>`;
      });
      html += `<div class="mem-section"><h3>${sec} · ${SECTIONS[sec]}</h3>${rows.join("") || '<div class="empty">ריק</div>'}</div>`;
    }
    $("memory").innerHTML = html;
  }

  function renderState(s, highlight) {
    state = s;
    $("model").textContent = `${s.model} · effort=${s.effort}`;
    for (const h of s.harnesses) {
      const b = $("h-" + h.name);
      b.disabled = !h.available;
      b.title = h.available ? "" : h.reason;
      b.setAttribute("aria-pressed", String(h.name === harness));
    }
    $("session").textContent = `session ${s.current.session}`;
    $("totals").textContent = `this page: ${calls[harness]} model calls · $${spent[harness].toFixed(4)}`;
    if (!highlight) lastMemory = null;
    renderMemory(s.memory);
    lastMemory = s.memory;
    $("logs").innerHTML = s.logs.map((l) => `<li><span class="mono">${esc(l.file)}</span><small>${fmt(l.lines)} שורות</small></li>`).join("");
    const off = !s.current.available;
    $("send").disabled = busy || off;
    $("input").disabled = off;
    $("input").placeholder = off ? "ה-harness הזה כבוי. ראי את ההסבר למעלה" : "שאלי על הלוגים, למשל: מה השגיאות העיקריות ב-app.log?";
  }

  // ---------- actions ----------
  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; $("send").disabled = true;
    const items = chats[harness];
    items.push({ kind: "user", text }, { kind: "working" });
    renderMessages();
    const t0 = Date.now();
    const timer = setInterval(() => { const e = $("elapsed"); if (e) e.textContent = `${Math.round((Date.now() - t0) / 1000)}s`; }, 500);
    try {
      const r = await api("/api/chat", { message: text });
      items.pop();
      items.push({ kind: "bot", turn: r.turn });
      spent[harness] += Number(r.turn.cost_usd) || 0; calls[harness] += r.turn.model_calls || 0;
      renderState(r, true);
    } catch (e) {
      items.pop();
      items.push({ kind: "error", text: `שגיאה: ${e.message}` });
    } finally {
      clearInterval(timer);
      busy = false;
      $("send").disabled = !(state && state.current.available);
      renderMessages();
      $("input").focus();
    }
  }

  async function action(path, divider) {
    if (busy) return;
    try {
      const s = await api(path, {});
      if (divider) chats[harness].push({ kind: "divider", text: divider(s) });
      renderState(s, true);
      renderMessages();
    } catch (e) {
      chats[harness].push({ kind: "error", text: `שגיאה: ${e.message}` });
      renderMessages();
    }
  }

  async function load() {
    try {
      renderState(await api(`/api/state?harness=${harness}`), false);
    } catch (e) {
      $("messages").innerHTML = `<div class="msg-bot error">השרת לא עונה. הריצי: <span class="mono" dir="ltr">python web/server.py</span></div>`;
      return;
    }
    renderMessages();
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("input").value; $("input").value = ""; autosize(); send(v); });
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
  const autosize = () => { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; };
  $("input").addEventListener("input", autosize);
  $("messages").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b) send(SUGGEST[Number(b.dataset.s)]); });
  document.querySelectorAll(".switch button").forEach((b) => b.addEventListener("click", () => { if (busy) return; harness = b.dataset.h; load(); }));
  $("newSession").addEventListener("click", () => action("/api/new-session", (s) => `שיחה חדשה (${s.current.session}): מופע חדש של הסוכן, הזיכרון נטען מהדיסק`));
  $("reset").addEventListener("click", () => { chats[harness] = []; spent[harness] = 0; calls[harness] = 0; action("/api/reset"); });
  $("simulate").addEventListener("click", () => action("/api/simulate", () => "נוספו שגיאות חדשות ל-worker.log"));
  $("upload").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const s = await api("/api/upload", { filename: f.name, content: await f.text() });
      chats[harness].push({ kind: "divider", text: `הועלה ${f.name}` });
      renderState(s, true); renderMessages();
    } catch (err) { chats[harness].push({ kind: "error", text: `העלאה נכשלה: ${err.message}` }); renderMessages(); }
  });
  $("railBtn").addEventListener("click", () => $("rail").classList.toggle("open"));

  load();
})();
</script>
</body>
</html>
